name: Build Ezzi Grocery APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Clean Release APK
        run: |
          mkdir -p /tmp/build_env
          cd /tmp/build_env
          flutter create ezzi_app --org com.ezzi.grocery --platforms android
          cd ezzi_app
          cp $GITHUB_WORKSPACE/pubspec.yaml ./pubspec.yaml
          rm -rf lib
          cp -r $GITHUB_WORKSPACE/lib ./lib
          flutter pub get
          flutter build apk --release --split-per-abi

          mkdir -p $GITHUB_WORKSPACE/build/app/outputs/flutter-apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk $GITHUB_WORKSPACE/build/app/outputs/flutter-apk/Ezzi-Grocery-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk $GITHUB_WORKSPACE/build/app/outputs/flutter-apk/Ezzi-Grocery-arm64.apk

      - name: Upload Optimized APKs
        uses: actions/upload-artifact@v4
        with:
          name: Ezzi-Grocery-APK-Optimized
          path: build/app/outputs/flutter-apk/*.apk
