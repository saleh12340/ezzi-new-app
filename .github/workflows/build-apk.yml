name: Build Ezzi Grocery Full APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Skeleton & Build APK
        run: |
          flutter create . --org com.ezzi.grocery --platforms android
          flutter pub get
          flutter build apk --debug

      - name: Upload Complete APK
        uses: actions/upload-artifact@v4
        with:
          name: Ezzi-Grocery-App
          path: build/app/outputs/flutter-apk/app-debug.apk
