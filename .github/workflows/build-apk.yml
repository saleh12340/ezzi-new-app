name: Build Ezzi Grocery APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean Old Android Files & Recreate
        run: |
          rm -rf android
          flutter create --platforms=android --org com.ezzi.grocery .
          flutter pub get

      - name: Build Full APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ezzi-Grocery-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
