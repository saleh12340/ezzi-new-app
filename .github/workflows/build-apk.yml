name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install Cordova
        run: npm install -g cordova
      
      - name: Create and Build
        run: |
          cd /tmp
          cordova create app com.ezzi.grocery "بقالة العزي"
          cd app
          cordova platform add android
          rm -rf www/*
          cp $GITHUB_WORKSPACE/index.html www/
          cordova build android --debug
          mkdir -p $GITHUB_WORKSPACE/output
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/output/app.apk
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: output/app.apk
