name: Build Ezzi Grocery APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Clean Flutter Skeleton
        run: |
          mkdir -p /tmp/app_temp
          cd /tmp/app_temp
          flutter create ezzi_app --org com.ezzi.grocery
          cd ezzi_app
          cp $GITHUB_WORKSPACE/pubspec.yaml ./pubspec.yaml
          rm -rf lib
          cp -r $GITHUB_WORKSPACE/lib ./lib
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons
          mkdir -p $GITHUB_WORKSPACE/build/app/outputs/flutter-apk
          cp build/app/outputs/flutter-apk/app-debug.apk $GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ezzi-Grocery-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
