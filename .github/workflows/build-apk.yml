name: Build Ezzi Grocery APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android APK
        run: |
          mkdir -p /tmp/ezzi_workspace
          cd /tmp/ezzi_workspace
          flutter create ezzi_app --org com.ezzi.grocery --platforms android
          cd ezzi_app
          cp $GITHUB_WORKSPACE/pubspec.yaml ./pubspec.yaml
          rm -rf lib
          cp -r $GITHUB_WORKSPACE/lib ./lib
          flutter pub get
          flutter build apk --debug

          mkdir -p $GITHUB_WORKSPACE/build/app/outputs/flutter-apk
          cp build/app/outputs/flutter-apk/app-debug.apk $GITHUB_WORKSPACE/build/app/outputs/flutter-apk/Ezzi-Grocery-App.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ezzi-Grocery-APK
          path: build/app/outputs/flutter-apk/Ezzi-Grocery-App.apk
