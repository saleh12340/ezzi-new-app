name: Build Real Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova & Build Signed Android APK
        run: |
          npm install -g cordova
          cordova create ezzi_app com.ezzi.grocery "بقالة العزي"
          cd ezzi_app
          cordova platform add android
          
          # Copy website files into cordova www folder
          rm -rf www/*
          cp -r $GITHUB_WORKSPACE/* www/
          
          # Build Unsigned / Debug Android APK
          cordova build android --debug

          mkdir -p $GITHUB_WORKSPACE/output
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/output/Ezzi-Grocery-App.apk

      - name: Upload Real APK
        uses: actions/upload-artifact@v4
        with:
          name: Ezzi-Grocery-Real-APK
          path: output/Ezzi-Grocery-App.apk
