name: Build Ezzi Grocery APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses & Generate App
        run: |
          yes | flutter doctor --android-licenses || true
          mkdir -p /tmp/backup
          cp pubspec.yaml /tmp/backup/pubspec.yaml
          cp -r lib /tmp/backup/lib
          rm -rf android
          flutter create . --org com.ezzi.grocery --project-name ezzi_grocery --platforms android --android-language kotlin
          cp /tmp/backup/pubspec.yaml ./pubspec.yaml
          cp -r /tmp/backup/lib ./

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --suppress-analytics

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ezzi-Grocery-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
